repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: local
    hooks:
      - id: architecture
        name: architecture fitness (dependency rule)
        entry: .venv/bin/python -m pytest tests/test_architecture.py -q
        language: system
        pass_filenames: false
        always_run: true
      - id: tests
        name: full test suite (governance, evals, contracts)
        entry: .venv/bin/python -m pytest -q
        language: system
        pass_filenames: false
        always_run: true
